
name: Build Zajel Chat Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract Android project
        run: |
          mkdir -p project

          ZIP_FILE="ZajelChat-AndroidStudio-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            ls -lah
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d project

      - name: Find Android Gradle project
        id: locate
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No gradlew found"
            find project -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$WRAPPER"

      - name: Build Android APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output

          APK=$(find "${{ steps.locate.outputs.dir }}" \
            -type f -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          cp "$APK" output/ZajelChat.apk
          ls -lh output/

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: ZajelChat-APK
          path: output/ZajelChat.apk
          if-no-files-found: error
          retention-days: 7
